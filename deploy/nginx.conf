server {
  listen 80;
  root /usr/share/nginx/html;

  # acesso via tailscale serve: https://<host>.ts.net/oko/
  # (o app é buildado com base=/oko/, então os assets já pedem /oko/assets/...)
  location /oko/ {
      alias /usr/share/nginx/html/;
      index index.html;
      try_files $uri $uri/ /oko/index.html;
  }
  location = /oko/index.html {
      alias /usr/share/nginx/html/index.html;
      add_header Cache-Control "no-cache";
  }

  # SPA: qualquer rota cai no index.html
  location / {
      try_files $uri $uri/ /index.html;
  }
  # index.html nunca em cache: é o ponto de atualização do app (PWA inclusive)
  location = /index.html {
      add_header Cache-Control "no-cache";
  }
  # assets com hash no nome (Vite) podem ser imutáveis
  location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
