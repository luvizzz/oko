services:
  dev:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - oko-node-modules:/app/node_modules # deps vivem no volume, não no host
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"

  prod:
    build: .
    ports:
      - "8090:80"
    profiles: ["prod"]

volumes:
  oko-node-modules:
