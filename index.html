<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>oko</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #1a1a1e; color: #e8e8ea; display: flex; flex-direction: column; height: 100vh; }
    header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: #232329; border-bottom: 1px solid #333; }
    header h1 { font-size: 15px; margin: 0; letter-spacing: 2px; text-transform: lowercase; }
    header .spacer { flex: 1; }
    button { background: #3a3a44; color: #e8e8ea; border: 0; border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: default; }
    button:hover:not(:disabled) { background: #4a4a56; }
    #stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 16px; }
    #stage canvas { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 4px 24px rgba(0,0,0,.5); background: #000; }
    #status { font-size: 12px; color: #9a9aa4; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>oko</h1>
    <input type="file" id="file" accept="image/*" />
    <button id="btn-open">Abrir imagem</button>
    <span id="status">nenhuma imagem</span>
    <div class="spacer"></div>
    <button id="btn-export" disabled>Exportar PNG</button>
  </header>
  <div id="stage"><canvas id="canvas" width="0" height="0"></canvas></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
