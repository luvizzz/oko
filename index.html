<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a1e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>oko</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #1a1a1e; color: #e8e8ea; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    header { display: flex; align-items: center; gap: 12px; padding: calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 10px calc(16px + env(safe-area-inset-left)); background: #232329; border-bottom: 1px solid #333; }
    header h1 { font-size: 15px; margin: 0; letter-spacing: 2px; text-transform: lowercase; }
    header .spacer { flex: 1; }
    button { background: #3a3a44; color: #e8e8ea; border: 0; border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: default; }
    button:hover:not(:disabled) { background: #4a4a56; }
    #stage { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
    #wrap { position: relative; line-height: 0; }
    #wrap canvas { box-shadow: 0 4px 24px rgba(0,0,0,.5); background: #000; touch-action: none; user-select: none; -webkit-user-select: none; display: block; }
    #sel { position: absolute; border: 1px dashed #7db2ff; background: rgba(125,178,255,.18); display: none; pointer-events: none; }
    #quadsvg { position: absolute; inset: 0; pointer-events: none; display: none; overflow: visible; }
    #handles { display: none; }
    .handle { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #7db2ff; border: 2px solid #fff; transform: translate(-50%, -50%); cursor: grab; touch-action: none; box-shadow: 0 1px 6px rgba(0,0,0,.6); }
    .handle:active { cursor: grabbing; background: #fff; }
    .ch { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; }
    .ch input[type="range"] { width: 64px; accent-color: #7db2ff; }
    #sl-radius:disabled { opacity: .3; }
    .shape.on { outline: 1px solid #7db2ff; color: #fff; }
    #stage.cropping canvas { cursor: crosshair; }
    #status { font-size: 12px; color: #9a9aa4; }
    #tools { display: flex; align-items: center; gap: 8px; padding: 8px calc(16px + env(safe-area-inset-right)) 8px calc(16px + env(safe-area-inset-left)); background: #1e1e23; border-bottom: 1px solid #333; flex-wrap: wrap; }
    #tools:disabled, #tools.disabled { opacity: 0.35; pointer-events: none; }
    #tools .sep { width: 1px; height: 20px; background: #3a3a44; margin: 0 4px; }
    #tools label { font-size: 12px; color: #9a9aa4; }
    #tools input[type="number"] { width: 64px; background: #2a2a31; color: #e8e8ea; border: 1px solid #3a3a44; border-radius: 4px; padding: 4px 6px; font-size: 13px; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>oko</h1>
    <input type="file" id="file" accept="image/*" />
    <button id="btn-open">Abrir imagem</button>
    <span id="status">nenhuma imagem</span>
    <div class="spacer"></div>
    <button id="btn-export" disabled>PNG</button>
    <button id="btn-export-jpg" disabled>JPEG</button>
    <label class="ch">q<input type="range" id="sl-quality" min="50" max="100" value="85"></label>
    <span class="sep"></span>
    <button id="btn-undo" disabled>↩ desfazer</button>
    <button id="btn-redo" disabled>↪ refazer</button>
  </header>
  <div id="tools" class="disabled">
    <button id="btn-flip-x" title="espelho horizontal">↔</button>
    <button id="btn-flip-y" title="espelho vertical">↕</button>
    <span class="sep"></span>
    <button id="btn-rot-ccw" title="girar 90° anti-horário">⟲90°</button>
    <button id="btn-rot-cw" title="girar 90° horário">⟳90°</button>
    <label>ângulo <input type="range" id="inp-angle" min="-180" max="180" step="1" value="15" style="width:120px" /> <span id="lbl-angle" style="display:inline-block;min-width:3.5em">15°</span></label>
    <button id="btn-rot-free">girar</button>
    <span class="sep"></span>
    <label>L <input type="number" id="inp-w" min="1" /></label>
    <label>A <input type="number" id="inp-h" min="1" /></label>
    <button id="btn-resize">redimensionar</button>
    <span class="sep"></span>
    <button id="btn-crop">recortar</button>
    <button id="btn-crop-apply" style="display:none">aplicar</button>
    <button id="btn-crop-cancel" style="display:none">cancelar</button>
    <span class="sep"></span>
    <button id="btn-persp" title="puxe os 4 cantos para dar perspectiva">perspectiva</button>
    <button id="btn-persp-apply" style="display:none">aplicar</button>
    <button id="btn-persp-cancel" style="display:none">cancelar</button>
    <span class="sep"></span>
    <label class="ch" style="color:#ff8a8a">R<input type="range" id="sl-r" min="0" max="200" value="100"></label>
    <label class="ch" style="color:#9dff9d">G<input type="range" id="sl-g" min="0" max="200" value="100"></label>
    <label class="ch" style="color:#8ab4ff">B<input type="range" id="sl-b" min="0" max="200" value="100"></label>
    <button id="btn-color">aplicar cor</button>
    <span class="sep"></span>
    <button id="btn-shape-square" class="shape on" title="retângulo com cantos arredondados">cantos</button>
    <button id="btn-shape-oval" class="shape" title="elipse">oval</button>
    <button id="btn-shape-circle" class="shape" title="círculo">círculo</button>
    <label class="ch">raio<input type="range" id="sl-radius" min="0" max="100" value="25"></label>
    <button id="btn-border">aplicar borda</button>
    <span class="sep"></span>
    <button id="btn-reset" title="descartar edições, volta ao original">redefinir</button>
  </div>
  <div id="stage"><div id="wrap"><canvas id="canvas" width="0" height="0"></canvas><div id="sel"></div><svg id="quadsvg"><polygon points="" fill="rgba(125,178,255,.12)" stroke="#7db2ff" stroke-width="1.5" stroke-dasharray="4 3"/></svg><div id="handles"><i class="handle" data-i="0"></i><i class="handle" data-i="1"></i><i class="handle" data-i="2"></i><i class="handle" data-i="3"></i></div></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
